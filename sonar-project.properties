# SonarQube Cloud Free — PowerCoach Studio (CI-based scanner only)
#
# Placeholders match the common SonarCloud import of GitHub org `edar-dev`
# / repo `powercoach-studio`. Edoardo must confirm both values in the Sonar
# UI after signup/import and annotate the PR if they differ.
#
# Confirm after Sonar signup:
#   sonar.organization  → Sonar org key (often `edar-dev`)
#   sonar.projectKey    → project key (often `edar-dev_powercoach-studio`)
#
# IMPORTANT: Automatic Analysis (Sonar GitHub App) IGNORES this file.
# Scope for Automatic Analysis lives in `.sonarcloud.properties` (or the
# Sonar UI Analysis Scope). Prefer disabling Automatic Analysis and using
# this CI config as the source of truth — see docs/sonar-quality.md.
sonar.organization=edar-dev
sonar.projectKey=edar-dev_powercoach-studio

sonar.projectName=PowerCoach Studio
sonar.sourceEncoding=UTF-8

# Analyze Dart sources only (business code under lib/).
sonar.sources=lib
sonar.tests=test

# Free-tier LOC strategy (≤50k private LOC): exclude generated, l10n, mocks,
# design mockups, and vendored Drift web worker.
# See docs/sonar-quality.md.
sonar.exclusions=\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/l10n/**,\
  **/*.mocks.dart,\
  design/**,\
  web/drift_worker.js,\
  web/sqlite3.wasm

# Optional path for a later coverage upload (not generated in CI yet).
# Until flutter test --coverage + lcov upload is wired, disable the Quality Gate
# condition "Coverage on New Code" in Sonar UI — see docs/sonar-quality.md.
# Do not commit a stub/fake coverage/lcov.info.
sonar.dart.coverage.reportPaths=coverage/lcov.info
