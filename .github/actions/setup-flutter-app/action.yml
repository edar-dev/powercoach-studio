name: Setup Flutter app
description: Install Flutter, cache Dart tooling, resolve dependencies, and prepare CI .env

inputs:
  flutter-version:
    description: Flutter SDK version to install
    required: false
    default: "3.35.6"

runs:
  using: composite
  steps:
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable
        cache: true

    - name: Cache Dart tooling
      uses: actions/cache@v4
      with:
        path: .dart_tool
        key: dart-tool-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml', 'lib/**', 'web/index.html', 'web/manifest.json') }}
        restore-keys: |
          dart-tool-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-
          dart-tool-${{ runner.os }}-

    - name: Resolve Flutter dependencies
      shell: bash
      run: flutter pub get

    - name: Prepare .env for CI
      shell: bash
      run: |
        if [ -f .env.example ]; then
          cp .env.example .env
        else
          echo "SUPABASE_URL=https://placeholder.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=placeholder-anon-key" >> .env
        fi
