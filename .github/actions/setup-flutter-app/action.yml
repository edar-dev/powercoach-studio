name: Setup Flutter app
description: Install Flutter, cache Dart tooling, resolve dependencies, and prepare CI env asset

inputs:
  flutter-version:
    description: Flutter SDK version to install
    required: false
    default: "3.35.6"

runs:
  using: composite
  steps:
    - name: Setup Flutter
      # Pin full commit SHA (not floating @v2) for supply-chain safety.
      uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable
        cache: true

    - name: Cache Dart tooling
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .dart_tool
        key: dart-tool-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml', 'lib/**', 'web/index.html', 'web/manifest.json') }}
        restore-keys: |
          dart-tool-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-
          dart-tool-${{ runner.os }}-

    - name: Prepare env asset for CI
      shell: bash
      run: |
        if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_ANON_KEY:-}" ]; then
          cat > .env.example <<EOF
        SUPABASE_URL=${SUPABASE_URL}
        SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
        SENTRY_DSN=${SENTRY_DSN:-}
        SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-ci}
        EOF
        fi

    - name: Resolve Flutter dependencies
      shell: bash
      # Enforce pubspec.lock (Sonar githubactions:S8550).
      run: flutter pub get --enforce-lockfile
