name: Setup Flutter app
description: Install Flutter, cache Dart tooling, resolve dependencies, and prepare CI env asset

inputs:
  flutter-version:
    description: Flutter SDK version to install
    required: false
    default: "3.35.6"

runs:
  using: composite
  steps:
    # Own the SDK cache hit path. subosito/flutter-action with cache:true restores
    # ~1.5GB then still re-downloads the archive when bin/flutter is not executable
    # after restore (~54s wasted). On hit we chmod + export PATH and skip download.
    - name: Cache Flutter SDK
      id: cache-flutter-sdk
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: /opt/hostedtoolcache/flutter/stable-${{ inputs.flutter-version }}-x64
        key: flutter-sdk-${{ runner.os }}-x64-${{ inputs.flutter-version }}-v1

    - name: Setup Flutter (download)
      if: steps.cache-flutter-sdk.outputs.cache-hit != 'true'
      # Pin full commit SHA (not floating @v2) for supply-chain safety.
      uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable
        # SDK + pub caching handled explicitly below / above.
        cache: false

    - name: Setup Flutter (from cache)
      if: steps.cache-flutter-sdk.outputs.cache-hit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        FLUTTER_ROOT="/opt/hostedtoolcache/flutter/stable-${{ inputs.flutter-version }}-x64"
        if [ ! -f "$FLUTTER_ROOT/bin/flutter" ]; then
          echo "Cached Flutter SDK missing bin/flutter at $FLUTTER_ROOT"
          exit 1
        fi
        chmod +x "$FLUTTER_ROOT/bin/flutter" "$FLUTTER_ROOT/bin/dart" 2>/dev/null || true
        # dart-sdk binaries also need +x after some cache restores
        if [ -d "$FLUTTER_ROOT/bin/cache/dart-sdk/bin" ]; then
          chmod -R a+rX "$FLUTTER_ROOT/bin/cache/dart-sdk/bin" || true
        fi
        echo "FLUTTER_ROOT=$FLUTTER_ROOT" >> "$GITHUB_ENV"
        echo "PUB_CACHE=${PUB_CACHE:-$HOME/.pub-cache}" >> "$GITHUB_ENV"
        echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
        echo "$FLUTTER_ROOT/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
        echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
        export PATH="$FLUTTER_ROOT/bin:$FLUTTER_ROOT/bin/cache/dart-sdk/bin:$PATH"
        flutter --version

    - name: Cache pub dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.pub-cache
        key: flutter-pub-${{ runner.os }}-${{ inputs.flutter-version }}-${{ hashFiles('pubspec.lock', '.flutter-version') }}
        restore-keys: |
          flutter-pub-${{ runner.os }}-${{ inputs.flutter-version }}-
          flutter-pub-${{ runner.os }}-

    - name: Prepare env asset for CI
      shell: bash
      run: |
        if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_ANON_KEY:-}" ]; then
          cat > .env.example <<EOF
        SUPABASE_URL=${SUPABASE_URL}
        SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
        SENTRY_DSN=${SENTRY_DSN:-}
        SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-ci}
        POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
        POSTHOG_HOST=${POSTHOG_HOST:-https://eu.i.posthog.com}
        EOF
        fi

    - name: Resolve Flutter dependencies
      shell: bash
      # Enforce pubspec.lock (Sonar githubactions:S8550).
      run: flutter pub get --enforce-lockfile
