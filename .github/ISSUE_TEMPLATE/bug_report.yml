name: Bug report
description: Report a reproducible problem in PowerCoach Studio
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear description of the observed bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide deterministic steps.
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Web
        - Desktop
        - Multiple
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App version / commit
      description: Tag, version, or git commit hash.
      placeholder: v1.2.3 or abc1234

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: Paste relevant logs, errors, or screenshots.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I can reliably reproduce this issue.
          required: true
