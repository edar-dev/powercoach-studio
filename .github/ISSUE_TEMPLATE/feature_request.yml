name: Feature request
description: Propose an improvement or new capability
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user or business problem are we solving?
      placeholder: Today it is hard to...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and UX.
      placeholder: We should add...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other options and why they are less suitable.

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Low
        - Medium
        - High
    validations:
      required: true

  - type: checkboxes
    id: affected_area
    attributes:
      label: Affected area
      options:
        - label: Authentication
        - label: Customers
        - label: Dashboard
        - label: Exercise Library
        - label: Settings
        - label: Offline/Sync
        - label: Infrastructure

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List objective criteria to mark this complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
