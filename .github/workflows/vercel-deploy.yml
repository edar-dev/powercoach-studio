name: Vercel Deploy

on:
  push:
    branches:
      - main
      - feat/vercel-web-deploy
  workflow_dispatch:

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  FLUTTER_VERSION: "3.35.6"
  VERCEL_CLI_VERSION: "54.10.3"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-production:
    name: Build and deploy (prebuilt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Dart tooling
        uses: actions/cache@v4
        with:
          path: .dart_tool
          key: dart-tool-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml', 'lib/**', 'web/index.html', 'web/manifest.json') }}
          restore-keys: |
            dart-tool-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-
            dart-tool-${{ runner.os }}-

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Vercel CLI
        uses: actions/cache@v4
        with:
          path: ~/.vercel-cli
          key: vercel-cli-${{ runner.os }}-${{ env.VERCEL_CLI_VERSION }}

      - name: Install Vercel CLI
        run: |
          export NPM_CONFIG_PREFIX="$HOME/.vercel-cli"
          export PATH="$NPM_CONFIG_PREFIX/bin:$PATH"
          if ! command -v vercel >/dev/null 2>&1; then
            npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}
          fi
          echo "$NPM_CONFIG_PREFIX/bin" >> "$GITHUB_PATH"
          vercel --version

      - name: Build Flutter web
        run: bash scripts/ci-build-web.sh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GYMBLOG_API_URL: ${{ secrets.GYMBLOG_API_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT || 'production' }}

      - name: Package prebuilt output
        run: bash scripts/package-vercel-prebuilt.sh

      - name: Deploy prebuilt to Vercel
        run: vercel deploy --prebuilt --prod --yes
