name: Vercel Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  FLUTTER_VERSION: "3.35.6"
  VERCEL_CLI_VERSION: "54.10.3"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-production:
    name: Build and deploy (prebuilt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter app
        uses: ./.github/actions/setup-flutter-app
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Cache Vercel CLI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.vercel-cli
          key: vercel-cli-${{ runner.os }}-${{ env.VERCEL_CLI_VERSION }}

      - name: Install Vercel CLI
        run: |
          export NPM_CONFIG_PREFIX="$HOME/.vercel-cli"
          export PATH="$NPM_CONFIG_PREFIX/bin:$PATH"
          if ! command -v vercel >/dev/null 2>&1; then
            npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}
          fi
          echo "$NPM_CONFIG_PREFIX/bin" >> "$GITHUB_PATH"
          vercel --version

      - name: Build Flutter web
        run: bash scripts/ci-build-web.sh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT || 'production' }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          # Relative first-party proxy (vercel.json + prebuilt routes). Override
          # secret only if you intentionally need a different ingest host.
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST || '/pcs-ph' }}

      - name: Package prebuilt output
        run: bash scripts/package-vercel-prebuilt.sh

      - name: Deploy prebuilt to Vercel
        run: vercel deploy --prebuilt --prod --yes
