name: Flutter CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "design/**"
      - ".cursor/**"
      - "tool/openmetadata/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "design/**"
      - ".cursor/**"
      - "tool/openmetadata/**"

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.6"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter app
        uses: ./.github/actions/setup-flutter-app
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Static analysis
        run: flutter analyze --no-pub

  test:
    name: Unit and widget tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter app
        uses: ./.github/actions/setup-flutter-app
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Unit and widget tests
        # --concurrency matches ubuntu-latest vCPUs; shards cut wall-clock of ~200 test files.
        run: >
          flutter test test/ --no-pub
          --concurrency=4
          --total-shards=2
          --shard-index=${{ matrix.shard }}

  # Preserve the branch-protection check name "Unit and widget tests".
  test_gate:
    name: Unit and widget tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all shards
        run: |
          case "${{ needs.test.result }}" in
            success) echo "All test shards passed"; exit 0 ;;
            *)
              echo "Test shards result: ${{ needs.test.result }}"
              exit 1
              ;;
          esac

  # SonarQube Cloud Free scan (informational). Job always runs after analyze so
  # the workflow validates; checkout/scan skip when SONAR_TOKEN is unset
  # (secrets cannot be used in job-level `if`). Quality Gate is not a required
  # branch-protection check in this first release.
  # No Flutter setup: scanner reads lib/ + sonar-project.properties only
  # (coverage upload not wired yet — see docs/sonar-quality.md).
  sonar:
    name: SonarQube Cloud
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Detect Sonar token
        id: detect
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN unset — skipping Sonar scan"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.detect.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        if: steps.detect.outputs.skip != 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
