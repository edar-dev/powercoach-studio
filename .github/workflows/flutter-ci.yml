name: Flutter CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.6"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter app
        uses: ./.github/actions/setup-flutter-app
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Static analysis
        run: flutter analyze --no-pub

  test:
    name: Unit and widget tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter app
        uses: ./.github/actions/setup-flutter-app
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Unit and widget tests
        run: flutter test test/ --no-pub

  # SonarQube Cloud Free scan (informational). Job always runs after analyze so
  # the workflow validates; checkout/Flutter/scan skip when SONAR_TOKEN is unset
  # (secrets cannot be used in job-level `if`). Quality Gate is not a required
  # branch-protection check in this first release.
  sonar:
    name: SonarQube Cloud
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Detect Sonar token
        id: detect
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN unset — skipping Sonar scan"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.detect.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Flutter app
        if: steps.detect.outputs.skip != 'true'
        uses: ./.github/actions/setup-flutter-app
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: SonarQube Scan
        if: steps.detect.outputs.skip != 'true'
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
