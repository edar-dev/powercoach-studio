# SonarQube Cloud Automatic Analysis config (GitHub App).
#
# This file is NOT the same as sonar-project.properties.
# Automatic Analysis ignores sonar-project.properties entirely — see:
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
#
# Prefer turning Automatic Analysis OFF and using CI (docs/sonar-quality.md):
# Dart is unsupported by Automatic Analysis. Until then, narrow AA scope here.
#
# Docs: wildcard patterns are not allowed in this file. Use exact paths.
# Directory names exclude that tree; pair with CI sonar.exclusions for ** globs.

# Business Dart only (AA still cannot analyze Dart; this keeps design/web out).
sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Belt-and-suspenders if sources are ignored for any language on this project.
sonar.exclusions=design,web/drift_worker.js,web/sqlite3.wasm
