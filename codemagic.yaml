workflows:
  pr_quality_gate:
    name: PR Quality Gate
    max_build_duration: 30
    environment:
      flutter: stable
      groups:
        - google_credentials
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/build
        - $HOME/.gradle/caches
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Validate required environment variables
        script: |
          set -e
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing SUPABASE_ANON_KEY" && exit 1)
      - name: Create runtime .env
        script: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          SENTRY_DSN=${SENTRY_DSN:-}
          SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-ci}
          GYMBLOG_API_URL=${GYMBLOG_API_URL:-}
          EOF
      - name: Install dependencies
        script: flutter pub get
      - name: Static analysis
        script: flutter analyze
      - name: Unit and widget tests
        script: flutter test test/

  android_release:
    name: Android Release Build
    max_build_duration: 45
    environment:
      flutter: stable
      groups:
        - google_credentials
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/build
        - $HOME/.gradle/caches
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Validate required environment variables
        script: |
          set -e
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing SUPABASE_ANON_KEY" && exit 1)
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
      - name: Create runtime .env
        script: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          SENTRY_DSN=${SENTRY_DSN:-}
          SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
          GYMBLOG_API_URL=${GYMBLOG_API_URL:-}
          EOF
      - name: Create Android keystore and key.properties
        script: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Install dependencies
        script: flutter pub get
      - name: Unit and widget tests
        script: flutter test test/
      - name: Build Android APK
        script: flutter build apk --release
      - name: Build Android App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt

  android_play_store:
    name: Android Play Store Publish
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - google_credentials
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/build
        - $HOME/.gradle/caches
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: v*
          include: true
    scripts:
      - name: Validate required environment variables
        script: |
          set -e
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing SUPABASE_ANON_KEY" && exit 1)
          test -n "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" || (echo "Missing GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" && exit 1)
          python3 <<'PY'
          import json, os, sys
          raw = os.environ.get("GCLOUD_SERVICE_ACCOUNT_CREDENTIALS", "").strip()
          if not raw:
              print("GCLOUD_SERVICE_ACCOUNT_CREDENTIALS is empty")
              sys.exit(1)
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as exc:
              print("GCLOUD_SERVICE_ACCOUNT_CREDENTIALS is not valid JSON:", exc)
              print("In Codemagic group google_credentials, paste the FULL service account .json file content (Secret).")
              print("Do not use base64, a file path, or Play Console OAuth client JSON.")
              sys.exit(1)
          for key in ("type", "project_id", "private_key", "client_email"):
              if key not in data:
                  print(f"Service account JSON missing required field: {key}")
                  sys.exit(1)
          if data.get("type") != "service_account":
              print('Service account JSON "type" must be "service_account"')
              sys.exit(1)
          print("Google Play service account credentials validated")
          PY
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
      - name: Create runtime .env
        script: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          SENTRY_DSN=${SENTRY_DSN:-}
          SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
          GYMBLOG_API_URL=${GYMBLOG_API_URL:-}
          EOF
      - name: Create Android keystore and key.properties
        script: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Install dependencies
        script: flutter pub get
      - name: Unit and widget tests
        script: flutter test test/
      - name: Build Android App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
