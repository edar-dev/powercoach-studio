workflows:
  pr_quality_gate:
    name: PR Quality Gate
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: stable
      groups:
        - powercoach_studio_secrets
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Validate required environment variables
        script: |
          set -e
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing SUPABASE_ANON_KEY" && exit 1)
      - name: Create runtime .env
        script: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          SENTRY_DSN=${SENTRY_DSN:-}
          SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-ci}
          GYMBLOG_API_URL=${GYMBLOG_API_URL:-}
          EOF
      - name: Install dependencies
        script: flutter pub get
      - name: Static analysis
        script: flutter analyze
      - name: Unit and widget tests
        script: flutter test test/

  android_release:
    name: Android Release Build
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      flutter: stable
      groups:
        - powercoach_studio_secrets
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      tag_patterns:
        - pattern: v*
          include: true
    scripts:
      - name: Validate required environment variables
        script: |
          set -e
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing SUPABASE_ANON_KEY" && exit 1)
      - name: Create runtime .env
        script: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          SENTRY_DSN=${SENTRY_DSN:-}
          SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
          GYMBLOG_API_URL=${GYMBLOG_API_URL:-}
          EOF
      - name: Install dependencies
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --release
      - name: Build Android App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
