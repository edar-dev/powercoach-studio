<!DOCTYPE html>

<body class="bg-surface text-on-surface font-sans text-sm flex flex-col min-h-screen">
<main class="px-4 pb-6 flex flex-col gap-4">
<div class="flex items-center justify-between pt-2">
<h1 class="text-lg font-semibold">Calendario Coach</h1>
<button class="h-10 px-3.5 rounded-lg bg-primary-container text-on-primary text-xs font-semibold">+ Sessione</button>
</div>
<div class="bg-surface-container rounded-xl p-2 flex flex-col gap-2">
<div class="flex items-center justify-between">
<div class="flex items-center gap-1">
<button class="w-9 h-9 rounded-lg bg-surface-container-high">‹</button>
<span class="text-sm font-semibold px-1">Settembre 2026</span>
<button class="w-9 h-9 rounded-lg bg-surface-container-high">›</button>
</div>
<div class="flex gap-1.5"><button class="h-8 px-2.5 rounded-md bg-surface-container-highest text-primary text-[11px] uppercase">Oggi</button>
<div class="flex bg-surface-container-lowest p-0.5 rounded-lg"><button class="px-2.5 py-1 rounded bg-primary-container text-on-primary text-[11px]">M</button><button class="px-2.5 py-1 text-[11px] text-on-surface-variant">S</button><button class="px-2.5 py-1 text-[11px] text-on-surface-variant">G</button></div></div>
</div>
<div class="flex gap-1 overflow-x-auto"><button class="px-3 py-1.5 rounded-full bg-secondary-container text-xs whitespace-nowrap">Tutti gli Atleti</button><button class="px-3 py-1.5 rounded-full bg-surface-container-high text-xs whitespace-nowrap">Edoardo M.</button></div>
</div>
<div class="bg-surface-container rounded-xl p-2">
<div class="grid grid-cols-7 text-center text-[11px] text-on-surface-variant py-1"><span>LUN</span><span>MAR</span><span>MER</span><span>GIO</span><span>VEN</span><span>SAB</span><span>DOM</span></div>
<!-- days: dots primary-container=workout, tertiary=done, secondary=checkin; selected day circle primary-container -->
<div class="grid grid-cols-7 gap-y-1.5 text-center text-[13px]">
<!-- implement full month grid in Flutter from real dates; selected = w-8 h-8 rounded-full bg-primary-container -->
</div>
<div class="flex justify-center gap-4 pt-2 text-[11px] text-on-surface-variant"><span>● Workout</span><span>● Completato</span><span>● Check-in</span></div>
</div>
<div class="flex justify-between items-center"><div><h2 class="text-base font-semibold">Lunedì 28 Settembre</h2><p class="text-[11px] text-on-surface-variant">2 sessioni · 1 check-in</p></div><span class="px-2.5 py-1 rounded-full bg-surface-container-high text-secondary text-[11px]">Oggi</span></div>
<!-- Session cards: left accent bar, initials avatar, status pill, Apri Scheda / Chat -->
<article class="bg-surface-container rounded-xl p-2 relative overflow-hidden"><div class="absolute left-0 top-0 bottom-0 w-1 bg-secondary"></div>
<div class="pl-2 flex justify-between"><div><div class="font-semibold">Edoardo Moretti</div><div class="text-[11px] text-secondary">18:30 • In programma</div></div><span class="text-[11px] text-secondary">In Attesa</span></div>
<div class="mt-2 bg-surface-container-low rounded-lg p-2.5"><div class="font-semibold text-sm">Giorno B: Lower Power</div><div class="text-[13px] text-on-surface-variant">6 Esercizi · 65 min</div></div>
<div class="mt-2 flex gap-2"><button class="flex-1 h-11 rounded-lg bg-primary-container text-on-primary text-xs font-semibold">Apri Scheda</button><button class="w-11 h-11 rounded-lg bg-surface-container-high">💬</button></div>
</article>
</main></body></html>
