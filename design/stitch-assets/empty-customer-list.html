<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PowerCoach Studio - Clients</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#0d59f2",
                "background-light": "#f5f6f8",
                "background-dark": "#101622",
              },
              fontFamily: {
                "display": ["Inter"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
          },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-display">
<!-- Top App Bar -->
<header class="sticky top-0 z-10 flex items-center justify-between px-4 py-4 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-400">menu</span>
<h1 class="text-xl font-bold tracking-tight">Clients</h1>
</div>
<div class="flex items-center gap-2">
<button class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined">search</span>
</button>
<div class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center border border-primary/30">
<span class="material-symbols-outlined text-primary text-sm filled-icon">person</span>
</div>
</div>
</header>
<!-- Main Content: Empty State -->
<main class="flex-1 flex flex-col items-center justify-center px-6 py-12 text-center">
<!-- Illustration Container -->
<div class="relative mb-8">
<div class="w-64 h-64 rounded-full bg-gradient-to-tr from-primary/10 to-transparent flex items-center justify-center">
<div class="w-48 h-48 rounded-full bg-primary/5 flex items-center justify-center border border-dashed border-primary/20">
<span class="material-symbols-outlined text-8xl text-primary/40">group_add</span>
</div>
</div>
<!-- Decorative elements following Material 3 styles -->
<div class="absolute -top-4 -right-4 w-12 h-12 rounded-lg bg-primary/20 rotate-12 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-xl">fitness_center</span>
</div>
<div class="absolute -bottom-2 -left-6 w-10 h-10 rounded-full bg-primary/30 -rotate-12 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-lg">calendar_today</span>
</div>
</div>
<!-- Text Content -->
<div class="max-w-xs space-y-3">
<h2 class="text-2xl font-bold text-slate-900 dark:text-slate-100">No clients yet</h2>
<p class="text-slate-600 dark:text-slate-400 leading-relaxed">
                Let's grow your studio! Start by adding your first client to track their progress and manage their workouts.
            </p>
</div>
<!-- Secondary Action -->
<button class="mt-8 px-6 py-2 rounded-full border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-medium hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
            Import from contacts
        </button>
</main>
<!-- Floating Action Button (FAB) -->
<div class="fixed bottom-24 right-6">
<button class="flex items-center gap-3 bg-primary text-white px-6 py-4 rounded-xl shadow-lg shadow-primary/30 hover:shadow-primary/50 transition-all active:scale-95 group">
<span class="material-symbols-outlined text-2xl">add</span>
<span class="font-bold tracking-wide">Add Your First Client</span>
</button>
</div>
<!-- Bottom Navigation Bar -->
<nav class="sticky bottom-0 w-full bg-background-light dark:bg-background-dark border-t border-slate-200 dark:border-slate-800 px-2 py-2">
<div class="flex items-center justify-around max-w-lg mx-auto">
<a class="flex flex-col items-center gap-1 p-2 text-slate-500 dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="text-[10px] font-medium uppercase tracking-wider">Dashboard</span>
</a>
<a class="flex flex-col items-center gap-1 p-2 text-primary" href="#">
<span class="material-symbols-outlined filled-icon">group</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Clients</span>
</a>
<a class="flex flex-col items-center gap-1 p-2 text-slate-500 dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">exercise</span>
<span class="text-[10px] font-medium uppercase tracking-wider">Workouts</span>
</a>
<a class="flex flex-col items-center gap-1 p-2 text-slate-500 dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="text-[10px] font-medium uppercase tracking-wider">Settings</span>
</a>
</div>
</nav>
</body></html>
