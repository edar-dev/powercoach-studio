<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Settings - PowerCoach Studio</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#0d59f2",
              "background-light": "#f5f6f8",
              "background-dark": "#101622",
            },
            fontFamily: {
              "display": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen">
<div class="max-w-2xl mx-auto px-4 py-8 md:py-12">
<!-- Header -->
<header class="mb-10">
<div class="flex items-center gap-4 mb-2">
<button class="p-2 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-icons">arrow_back</span>
</button>
<h1 class="text-3xl font-bold tracking-tight">App Settings</h1>
</div>
<p class="text-slate-500 dark:text-slate-400 ml-12">Manage your preferences and account configuration for PowerCoach Studio.</p>
</header>
<!-- User Profile Quick View -->
<div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-6 mb-8 flex items-center gap-4">
<img alt="User Profile" class="w-16 h-16 rounded-full object-cover ring-2 ring-primary/20" data-alt="Professional portrait of a fitness coach" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDqXBBh_yekeOciBAuGu56K6s7qBK80TwBwqvyNBrRXhd00QhU-ozBtu6AHBS3yh5ON4V5-siAT4-j3a2vlLqsjGW5RKEuMHGjTVpPlNR-ef_dOfcxbAMofcXw8H1jezCK7ZcOPF8TesYUKUgm1BeJms1X1Kgj6uDa68zaqf_D-1Gv8vd0eRqk7lTegD1S8-tOBAA-6AwCvgXsBwo5ITJxTTfmjQNRMS1HUPjunnhkYucDPajZ475hzmqjvAWWfk6gyOZnElWVIghyi"/>
<div>
<h2 class="text-lg font-semibold">Alex Rivera</h2>
<p class="text-sm text-slate-500 dark:text-slate-400">Pro Studio Plan</p>
</div>
<button class="ml-auto px-4 py-2 text-primary border border-primary/20 hover:bg-primary/5 rounded-lg transition-colors font-medium text-sm">
                Edit Profile
            </button>
</div>
<!-- Settings Groups -->
<div class="space-y-6">
<!-- Appearance Section -->
<section>
<h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-3 px-2">Appearance</h3>
<div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl divide-y divide-slate-100 dark:divide-slate-800">
<!-- Dark Mode Toggle -->

<!-- Language Selector -->
<div class="flex items-center justify-between p-4">
<div class="flex items-center gap-3">
<div class="w-10 h-10 flex items-center justify-center bg-primary/10 rounded-lg text-primary">
<span class="material-icons text-xl">language</span>
</div>
<div>
<p class="font-medium">Language</p>
<p class="text-xs text-slate-500 dark:text-slate-400">System language preference</p>
</div>
</div>
<select class="bg-slate-100 dark:bg-slate-800 border-none rounded-lg text-sm px-3 py-2 focus:ring-2 focus:ring-primary appearance-none cursor-pointer pr-8">
<option value="en">English (US)</option>
<option value="es">Español</option>
<option value="fr">Français</option>
<option value="de">Deutsch</option>
</select>
</div>
</div>
</section>
<!-- Notifications Section -->

<!-- Storage & Data -->
<section>
<h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-3 px-2">Account &amp; Security</h3>
<div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl divide-y divide-slate-100 dark:divide-slate-800">
<!-- Password -->
<button class="w-full flex items-center justify-between p-4 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors text-left group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 flex items-center justify-center bg-primary/10 rounded-lg text-primary">
<span class="material-icons text-xl">lock</span>
</div>
<div>
<p class="font-medium">Change Password</p>
<p class="text-xs text-slate-500 dark:text-slate-400">Last changed 3 months ago</p>
</div>
</div>
<span class="material-icons text-slate-400 group-hover:text-primary transition-colors">chevron_right</span>
</button>
<!-- Data Usage -->
<button class="w-full flex items-center justify-between p-4 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors text-left group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 flex items-center justify-center bg-primary/10 rounded-lg text-primary">
<span class="material-icons text-xl">data_usage</span>
</div>
<div>
<p class="font-medium">Data &amp; Storage</p>
<p class="text-xs text-slate-500 dark:text-slate-400">Manage cache and video quality</p>
</div>
</div>
<span class="material-icons text-slate-400 group-hover:text-primary transition-colors">chevron_right</span>
</button>
</div>
</section>
<!-- Danger Zone -->
<section class="pt-4">
<div class="bg-red-500/5 border border-red-500/20 rounded-xl overflow-hidden">
<button class="w-full flex items-center justify-between p-4 hover:bg-red-500/10 transition-colors text-left group">
<div class="flex items-center gap-3">
<div class="w-10 h-10 flex items-center justify-center bg-red-500/10 rounded-lg text-red-500">
<span class="material-icons text-xl">logout</span>
</div>
<div>
<p class="font-medium text-red-600 dark:text-red-400">Sign Out</p>
<p class="text-xs text-red-500/60">Log out of this device</p>
</div>
</div>
</button>
</div>
</section>
</div>
<!-- Footer Info -->
<footer class="mt-12 text-center">
<p class="text-sm text-slate-500 dark:text-slate-400 mb-1">PowerCoach Studio v2.4.1</p>
<div class="flex justify-center gap-4 text-xs font-medium text-primary">
<a class="hover:underline" href="#">Privacy Policy</a>
<span class="text-slate-300 dark:text-slate-700">•</span>
<a class="hover:underline" href="#">Terms of Service</a>
</div>
</footer>
</div>
</body></html>
