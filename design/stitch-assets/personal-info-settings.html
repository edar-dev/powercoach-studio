<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Personal Info - PowerCoach Studio</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d59f2",
                        "background-light": "#f5f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 transition-colors duration-300">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 flex items-center bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md p-4 justify-between border-b border-slate-200 dark:border-slate-800">
<button aria-label="Go back" class="flex size-10 items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">arrow_back</span>
</button>
<h1 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight flex-1 px-4">Personal Info</h1>
<button class="px-4 py-2 rounded-full text-primary font-bold hover:bg-primary/10 transition-colors">
                Save
            </button>
</header>
<main class="flex-1 max-w-2xl mx-auto w-full pb-10">
<!-- Profile Header -->
<section class="flex flex-col items-center p-8 @container">
<div class="relative group">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full h-32 w-32 border-4 border-primary/20" data-alt="Professional headshot of a fitness coach in a gym environment" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDM5rza9Vl5OCGFumi4YcxgvTseDy-6WRgUwRQiOa_7AG3ZbB9Tw1Aw4_DdodPwfNWQn2O7zf-p8FEvlraCMDYaHYhsex4OW2rTQam9GnhU_pemqEz2KxTmQPpaMXUiRoPLXccmsDxo5x2TQfTppPpyNRjsWMtWRMtF6VB1HiHgP9nFsut-2jmzdNus-SBvZCdCiBOwmTqEsXZkYmAc-uG-camA32LwaISUlOtqU-r9ru9BCbWJYHgv2Zj786nyyi8jMxiuUPoZAyO8");'>
</div>
<button class="absolute bottom-0 right-0 p-2 bg-primary text-white rounded-full shadow-lg border-2 border-background-dark hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-sm">photo_camera</span>
</button>
</div>
<div class="mt-4 text-center">
<h2 class="text-slate-900 dark:text-slate-100 text-2xl font-bold">Coach Alex Johnson</h2>
<p class="text-slate-500 dark:text-slate-400 font-medium">Head Powerlifting Coach</p>
</div>
</section>
<!-- Form Sections -->
<div class="px-4 space-y-6">
<!-- Full Name -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold px-1">Full Name</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors">person</span>
</div>
<input class="block w-full rounded-xl border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50 py-4 pl-12 pr-4 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none" placeholder="Enter your full name" type="text" value="Alex Johnson"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold px-1">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors">mail</span>
</div>
<input class="block w-full rounded-xl border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50 py-4 pl-12 pr-4 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none" placeholder="your@email.com" type="email" value="alex.johnson@powercoach.studio"/>
</div>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold px-1">Phone Number</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors">call</span>
</div>
<input class="block w-full rounded-xl border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50 py-4 pl-12 pr-4 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none" placeholder="+1 (000) 000-0000" type="tel" value="+1 (555) 123-4567"/>
</div>
</div>
<!-- Location -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold px-1">Location</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors">location_on</span>
</div>
<input class="block w-full rounded-xl border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50 py-4 pl-12 pr-4 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none" data-location="Austin, Texas" placeholder="City, State" type="text" value="Austin, Texas"/>
</div>
</div>
<!-- Bio -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold px-1">Bio</label>
<div class="relative group">
<div class="absolute top-4 left-4 pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors">description</span>
</div>
<textarea class="block w-full rounded-xl border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50 py-4 pl-12 pr-4 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none resize-none" placeholder="Tell your students about yourself..." rows="4">Dedicated powerlifting coach with 10+ years of experience helping athletes break PRs and master technique. Certified USAPL coach.</textarea>
</div>
</div>
</div>
<!-- Danger Zone -->
<div class="mt-12 px-4 border-t border-slate-200 dark:border-slate-800 pt-8">
<button class="flex w-full items-center justify-between p-4 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-600 dark:text-red-400 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined">delete_forever</span>
<span class="font-bold">Delete Account</span>
</div>
<span class="material-symbols-outlined">chevron_right</span>
</button>
<p class="mt-4 text-xs text-slate-500 text-center px-4">
                    Changes to your personal information may take a few minutes to reflect across the entire platform.
                </p>
</div>
</main>
<!-- Bottom Navigation Spacer -->
<div class="h-10"></div>
</div>
</body></html>
